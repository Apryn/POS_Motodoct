<!DOCTYPE html>
<html lang="id">
<head>
    <!-- Secure Route Guard & Role Access Control -->
  <script>
    (function() {
      const token = localStorage.getItem('token');
      const user = JSON.parse(localStorage.getItem('user') || '{}');
      if (!token) {
        window.location.href = 'login.html';
        return;
      }
      
      const allPages = [
        'dashboard.html', 'transaksi.html', 'keranjang.html', 'sparepart.html',
        'pembelian.html', 'pengeluaran.html', 'kategori.html', 'servis.html',
        'mekanik.html', 'pelanggan.html', 'laporan.html', 'notifikasi.html', 'user.html'
      ];
      const rolePages = {
        admin: allPages,
        kasir: allPages,
        gudang: allPages,
        owner: allPages
      };
      
      const roleDefaults = {
        admin: 'dashboard.html',
        kasir: 'transaksi.html',
        gudang: 'sparepart.html',
        owner: 'dashboard.html'
      };
      
      const currentPage = window.location.pathname.split('/').pop() || 'index.html';
      
      if (currentPage === 'index.html') {
        window.location.href = roleDefaults[user.role] || 'login.html';
        return;
      }
      
      const allowedPages = rolePages[user.role] || [];
      const isAllowed = allowedPages.some(page => currentPage.includes(page));
      
      if (!isAllowed) {
        alert('Akses Ditolak: Role Anda (' + (user.role || 'user') + ') tidak memiliki izin untuk halaman ini!');
        window.location.href = roleDefaults[user.role] || 'login.html';
      } else {
        document.addEventListener('DOMContentLoaded', function() {
          document.querySelectorAll('.sidebar nav a').forEach(a => {
            const href = a.getAttribute('href');
            if (href) {
              const linkPage = href.split('/').pop();
              const isLinkAllowed = allowedPages.some(page => linkPage.includes(page));
              if (!isLinkAllowed) {
                a.style.display = 'none';
              }
            }
          });
        });
      }
    })();
  </script>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Keranjang Tersimpan — Motodoct</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <link rel="stylesheet" href="../css/table.css" />
  <style>
    .cart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .cart-card {
      background: #fff;
      border-radius: 12px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      overflow: hidden;
      transition: all 0.2s;
    }

    .cart-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

    .cart-card-header {
      background: #0f172a;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .plate-badge {
      background: #fff;
      color: #0f172a;
      font-size: 16px;
      font-weight: 900;
      padding: 4px 14px;
      border-radius: 6px;
      letter-spacing: 2px;
    }

    .cart-card-time {
      font-size: 11px;
      color: rgba(255,255,255,0.5);
    }

    .cart-card-body { padding: 14px 18px; }

    .cart-card-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 12px;
    }

    .cart-meta-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }

    .cart-meta-row strong { color: var(--text); }

    .cart-items-list {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-bottom: 12px;
    }

    .cart-item-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text);
      padding: 3px 0;
    }

    .cart-item-row span:last-child { color: var(--primary); font-weight: 600; }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 700;
      color: var(--text);
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 4px;
    }

    .cart-total span:last-child { color: var(--primary); }

    .cart-card-footer {
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }

    .btn-lanjut {
      flex: 1;
      padding: 10px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-lanjut:hover { background: var(--primary-dark); }

    .btn-hapus-cart {
      padding: 10px 14px;
      background: #fdecea;
      color: #e74c3c;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-hapus-cart:hover { background: #fbd5d2; }

    .empty-carts {
      text-align: center;
      padding: 64px 20px;
      color: var(--text-muted);
    }
    .empty-carts .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-carts h3 { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .empty-carts p { font-size: 13px; }
  </style>
</head>
<body>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

    <div class="sidebar-logo"><img src="../assets/logo.png" alt="Motodoct" /></div>
    <nav>
      <a href="dashboard.html" class="nav-item"><i data-lucide="layout-dashboard"></i><span class="nav-label">Dashboard</span></a>
      <a href="transaksi.html" class="nav-item"><i data-lucide="shopping-cart"></i><span class="nav-label">Transaksi</span></a>
      <a href="keranjang.html" class="nav-item active"><i data-lucide="archive"></i><span class="nav-label">Keranjang Tersimpan</span></a>
      <a href="sparepart.html" class="nav-item"><i data-lucide="package"></i><span class="nav-label">Stok Gudang</span></a>
      <a href="pembelian.html" class="nav-item"><i data-lucide="truck"></i><span class="nav-label">Pembelian Stok</span></a>
      <a href="pengeluaran.html" class="nav-item"><i data-lucide="wallet"></i><span class="nav-label">Pengeluaran</span></a>
      <a href="kategori.html" class="nav-item"><i data-lucide="folder"></i><span class="nav-label">Kategori</span></a>
      <a href="servis.html" class="nav-item"><i data-lucide="wrench"></i><span class="nav-label">Servis</span></a>
      <a href="mekanik.html" class="nav-item"><i data-lucide="user-cog"></i><span class="nav-label">Mekanik</span></a>
      <a href="pelanggan.html" class="nav-item"><i data-lucide="users"></i><span class="nav-label">Pelanggan</span></a>
      <a href="laporan.html" class="nav-item"><i data-lucide="bar-chart-2"></i><span class="nav-label">Laporan</span></a>

    </nav>
    <div class="sidebar-footer">
      <button class="btn-logout" onclick="logout()"><i data-lucide="log-out"></i> Keluar</button>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="hamburger" onclick="openSidebar()">☰</button>
        <div class="topbar-left">
          <h1>Keranjang Tersimpan</h1>
          <p>Servis yang belum selesai pembayaran</p>
        </div>
      </div>
      <div class="topbar-right">
        <a href="transaksi.html" class="btn-primary" style="text-decoration:none;padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;">+ Kasir</a>
        <div class="user-badge">

          <span class="user-badge-name" id="welcomeText">Admin</span>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-grid" style="margin-bottom:20px;">
      <div class="stat-card blue">
        <div class="stat-card-header">
          <span class="stat-card-label">Total Tersimpan</span>
          <div class="stat-card-icon">🗂</div>

      </div>
      <div class="stat-card orange">
        <div class="stat-card-header">

        </div>

      </div>
    </div>

    <!-- Search -->
    <div class="toolbar" style="margin-bottom:16px;">
      <div class="toolbar-left">
        <input type="text" id="searchInput" placeholder="🔍 Cari plat nomor atau nama pelanggan..." oninput="filterCarts()" />
      </div>
    </div>

    <!-- Grid -->
    <div id="cartGrid" class="cart-grid"></div>

  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="../js/keranjang.js"></script>
  <script>lucide.createIcons();</script>
