<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Cashier Motodoct</title>
  <link rel="stylesheet" href="../css/login.css" />
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <img src="../assets/logo.png" alt="Motodoct Logo" class="logo" />
      <hr class="divider" />
      <div class="login-header">
        <h2>Selamat Datang Kembali</h2>
        <p>Silakan masuk ke akun Anda untuk melanjutkan.</p>
      </div>
      <form id="loginForm">
        <div id="errorMsg" class="error-msg hidden"></div>
        <div class="input-group">
          <label for="username">Email atau Username</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            <input type="text" id="username" placeholder="Masukkan email atau username" required />
          </div>
        </div>
        <div class="input-group">
          <label for="password">Kata Sandi</label>
          <div class="input-wrap">
            <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="password" placeholder="Masukkan kata sandi" required />
            <button type="button" class="toggle-pass" onclick="togglePassword()" id="toggleBtn">
              <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>
        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" id="rememberMe" />
            Ingat Saya
          </label>
          <a href="#" class="forgot-link">Lupa Kata Sandi?</a>
        </div>
        <button type="submit" class="btn-login" id="btnLogin">Masuk →</button>
      </form>
      <p class="footer-text">Cashier System v1.0</p>
    </div>
  </div>
  <script src="../js/login.js"></script>
</body>
</html>
